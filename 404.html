<script>
/* same theme resolution as the main page: saved choice, else the OS setting; storage can throw */
(function(){var t=null;try{t=localStorage.getItem('theme');}catch(e){}
if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
document.documentElement.classList.add(t);
if(t==='dark')document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute('content','#0a0b10');});})();
</script>
<style>

html.dark{--bg:#0a0b10;--surface:rgba(28,31,42,.5);--ink:#eeeff3;--body:#c9ccd5;--muted:#9ea1ab;--line:rgba(255,255,255,.08);

  --aur1:rgba(126,155,255,.17);--aur2:rgba(179,155,255,.12);--aur3:rgba(95,216,240,.09);--shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -18px rgba(0,0,0,.6);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}

body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);

body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 34% at 22% 20%,var(--aur1),transparent 70%),radial-gradient(30% 30% at 80% 26%,var(--aur2),transparent 70%),radial-gradient(34% 30% at 64% 82%,var(--aur3),transparent 70%)}

.path{font:500 13px/1.4 "JetBrains Mono",ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}
